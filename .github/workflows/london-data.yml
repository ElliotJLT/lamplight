name: London case study data

# Refreshes the per-borough OSM lit-coverage benchmark (and attempts the
# registry ingests) from CI, where network access to Overpass and council
# portals is available, then commits the results to main.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC

permissions:
  contents: write

concurrency:
  group: london-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Borough lit-coverage benchmark (Overpass)
        run: node scripts/coverage.mjs --london > /tmp/coverage-table.md
      - name: Splice table into LONDON.md
        run: node scripts/update-london-doc.mjs /tmp/coverage-table.md
      - name: Ingest open lamp data (best effort)
        run: node scripts/ingest.mjs || true
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LONDON.md
          git add data/lamps 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: refresh London coverage benchmark"
            git push
          fi
